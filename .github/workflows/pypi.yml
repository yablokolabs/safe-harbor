name: Release

# Runs on every version tag (v*):
#   job "publish"  -> builds sdist + wheel, publishes to PyPI via trusted
#                     publishing (OIDC). No API tokens are stored in this repo.
#   job "bundle"   -> assembles the verified offline bundle from the locked
#                     artifacts and attaches it to a GitHub Release.
#
# The bundle job downloads every pinned artifact and verifies its SHA-256
# against manifest/checksums.sha256 before assembling. Nothing is published
# that does not verify.
#
# To release:
#   1. Bump the version in pyproject.toml (and Makefile VERSION + the
#      VERSION constant in acquisition/acquire_core.py, which must match).
#   2. git tag v<version> && git push origin v<version>
#
# First-time PyPI trusted-publisher setup (already done for v0.1.0):
#   https://pypi.org/manage/account/publishing/
#   owner yablokolabs / repo safe-harbor / workflow pypi.yml / env pypi
#   (the workflow FILE NAME, not the display name "Release")

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing to PyPI
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag version:  $TAG"
          echo "pyproject:     $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # tolerate re-runs of an already-uploaded tag

  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the GitHub Release and attach the bundle
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acquire and verify locked artifacts
        run: |
          ./acquisition/acquire.sh --if-missing
          ./acquisition/verify.sh --strict

      - name: Assemble the offline bundle
        run: |
          ./acquisition/assemble.sh

      - name: Upload bundle as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: safe-harbor-offline-bundle
          path: dist/*.tar.gz*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/safe-harbor-gen1-*.tar.gz \
            dist/safe-harbor-gen1-*.tar.gz.sha256 \
            --title "Safe Harbor $GITHUB_REF_NAME" \
            --notes "Offline bundle (verified artifacts) + PyPI release of the \`safeharbor\` CLI. See the [README](https://github.com/yablokolabs/safe-harbor#readme)."
