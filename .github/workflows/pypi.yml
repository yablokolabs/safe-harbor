name: Publish to PyPI

# Publishes safeharbor to PyPI using trusted publishing (OIDC) whenever a
# version tag (v*) is pushed. No API tokens are stored in this repository.
#
# One-time setup (required before the first release):
#   1. On PyPI: https://pypi.org/manage/account/publishing/
#   2. Create a project named "safeharbor" (or confirm ownership).
#   3. Add a "pending publisher":
#        PyPI Project:  safeharbor
#        GitHub Owner:  yablokolabs
#        GitHub Repo:   safe-harbor
#        Workflow name: publish-to-pypi.yml   (the file name below)
#        Environment:   (leave empty)
#   4. Tag the release as v<version> (e.g. v0.1.0) and push:
#        git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for trusted publishing to PyPI
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag version:  $TAG"
          echo "pyproject:     $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $VERSION"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
